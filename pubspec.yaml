name: responsibility_mirror
description: Una app de responsabilidad personal estilo David Goggins con espejo de metas y notificaciones motivacionales
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI y iconos
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  
  # Estado y navegación
  provider: ^6.1.1
  go_router: ^13.0.0
  
  # Almacenamiento local
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  
  # Notificaciones
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  
  # Utilidades
  intl: ^0.19.0
  uuid: ^4.3.3
  
  # Animaciones y efectos
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/logo.png
    - assets/quotes/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/logo.png"
  remove_alpha_ios: true
